# ============================================================
# Online-Mirror v4.0 Nginx 通用模板
# 部署前必须修改以下占位项：
# 1. server_name 改为你的真实域名
# 2. ssl_certificate /path/to/ssl/你的域名/fullchain.pem
#    ssl_certificate_key /path/to/ssl/你的域名/privkey.pem
# 3. root /path/to/mirror 改为网站实际根目录
# 4. fastcgi_pass unix:/var/run/php/php8.x-fpm.sock; 改成你服务器对应php-fpm版本（php8.1/php8.2等）
# 5. 证书需要提前用certbot/openssl申请，放置到对应路径
# 6. HSTS的preload谨慎开启，确认域名长期不变再启用
# 部署步骤：
# 1. 修改上述配置项
# 2. 放入 /etc/nginx/conf.d/
# 3. nginx -t 检测配置语法
# 4. nginx -s reload 生效
# ============================================================

server {
    listen       80;
    server_name  example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name  example.com;

    ssl_certificate /path/to/ssl/example.com/fullchain.pem;
    ssl_certificate_key /path/to/ssl/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    root /path/to/mirror;
    client_max_body_size 512M;
    index index.php index.html index.htm;
    error_page 404 /404.html;

    # 静态资源缓存
    location ~* \.(css|js|ico|webp|png|jpg|jpeg|gif|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ⚠️ 安全防护：禁止 uploads/img 目录执行 PHP
    location ~ ^/(uploads|img)/ {
        location ~ \.php$ { deny all; }
        location ~ \.(php|php5|phtml|inc|cgi|pl|sh|py)$ { deny all; }
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.x-fpm.sock;
    }

    # ========== 🌐 Clean URL 重写 (MVC v4.0) ==========
    location /capture/ {
        rewrite ^/capture/save$ /save.php last;
        rewrite ^/capture/([^/]+)$ /capture.php?id=$1 last;
    }
    location /photos/ { rewrite ^/photos/([^/]+)$ /photos.php?id=$1 last; }
    location /admin { rewrite ^/admin(/?)$ /dashboard.php last; }
    location /login { rewrite ^/login$ /login.php last; }
    location /logout { rewrite ^/logout$ /login.php?action=logout last; }
    location /settings { rewrite ^/settings$ /settings.php last; }
    location /install { rewrite ^/install$ /install.php last; }
    location /export { rewrite ^/export$ /export.php last; }
    location /api/ {
        rewrite ^/api/notify$ /notify.php last;
        rewrite ^/api/photos$ /ajax_photos.php last;
        rewrite ^/api/ai-analyze$ /ajax_ai_analyze.php last;
    }
    location = /fixlog { rewrite ^ /BUGFIX_LOG.md last; }
    # 兜底：/api/ 下未登录跳转的相对路径 login.php 会解析成 /api/login.php，重写回登录页
    location = /api/login.php { rewrite ^ /login.php last; }
    # 兼容 /mirror/ 开头的绝对路径（前端资源引用）：剥掉前缀映射到根目录
    location ^~ /mirror/ {
        rewrite ^/mirror/(.*)$ /$1 last;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }
}

